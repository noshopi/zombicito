<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>Zombicito - Edición Python</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #05030a;
        overflow: hidden;
    }
    #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #05030a;
    }
    #back {
        position: fixed;
        top: 8px;
        left: 10px;
        z-index: 10;
        pointer-events: none;
        color: #7ddb4f;
        font: 700 13px/1.4 "Segoe UI", system-ui, sans-serif;
        text-decoration: none;
        letter-spacing: 1px;
        background: rgba(10, 6, 18, .75);
        border: 1px solid #3a2352;
        border-radius: 6px;
        padding: 4px 10px;
        user-select: none;
        opacity: .6;
    }
    #back:hover { color: #a5f27a; }
    #status {
        position: fixed;
        bottom: 8px;
        left: 10px;
        z-index: 10;
        pointer-events: none;
        color: #6f6286;
        font: 12px/1.4 Consolas, monospace;
        letter-spacing: 1px;
    }
    #auth {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #211331 0, #05030a 60%);
        color: #e8d8f4;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    #authBox {
        width: min(360px, calc(100vw - 36px));
        padding: 24px;
        background: #100a1c;
        border: 1px solid #c8a042;
        box-shadow: 0 0 0 6px rgba(36, 22, 52, .8);
    }
    #authBox h1 { margin: 0 0 18px; color: #ffe678; font-size: 22px; letter-spacing: 2px; }
    #authBox input {
        box-sizing: border-box;
        width: 100%;
        margin: 5px 0;
        padding: 9px;
        color: #fff3b0;
        background: #1e122c;
        border: 1px solid #76558d;
    }
    #authBox button {
        margin: 12px 6px 0 0;
        padding: 8px 12px;
        color: #201329;
        background: #e8bd58;
        border: 0;
        cursor: pointer;
        font-weight: 700;
    }
    #authMsg { min-height: 20px; margin-top: 10px; color: #ff9b78; }
    #admin {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: auto;
        padding: 18px;
        box-sizing: border-box;
        background: #06040c;
        color: #e8d8f4;
        font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    #admin h1 { color: #ffe678; font-size: 20px; letter-spacing: 2px; margin: 0 0 6px; }
    #admin h2 { color: #c8a042; font-size: 15px; letter-spacing: 1px; margin: 18px 0 6px; }
    #admin table { width: 100%; border-collapse: collapse; background: #100a1c; }
    #admin th, #admin td { border: 1px solid #3a2352; padding: 5px 8px; text-align: left; }
    #admin th { background: #1e122c; color: #fff3b0; }
    #admin .ok { color: #7ddb4f; }
    #admin .ingame { color: #ff7a7a; }
    #admin .low { color: #7ddb4f; }
    #admin .mid { color: #ffd75e; }
    #admin .high { color: #ff7a7a; }
</style>
</head>
<body>
<div id="auth">
  <div id="authBox">
    <h1>ZOMBICITO</h1>
    <div>CREAR USUARIO</div>
    <input id="authEmail" type="email" autocomplete="email" placeholder="Correo electrónico">
    <input id="authPassword" type="password" maxlength="32" autocomplete="new-password" placeholder="Contraseña (máx. 6 caracteres)">
    <label style="display:block;margin-top:8px;"><input id="authRemember" type="checkbox"> RECORDAR MI CUENTA</label>
    <button id="authCreate">CREAR CUENTA</button>
    <button id="authLogin">INICIAR SESION</button>
    <div id="authMsg"></div>
  </div>
</div>
<div id="admin">
  <h1>ZOMBICITO - PANEL ADMIN</h1>
  <div id="adminStatus">conectando...</div>
  <h2>JUGADORES CONECTADOS</h2>
  <table id="adminPlayers"><thead><tr><th>#</th><th>EMAIL</th><th>PING</th><th>LOBBY</th></tr></thead><tbody></tbody></table>
  <h2>LOBBYS EN TIEMPO REAL</h2>
  <table id="adminLobbies"><thead><tr><th>NOMBRE</th><th>MUNDO</th><th>JUGADORES</th><th>BOTS</th><th>READY</th><th>ESTADO</th></tr></thead><tbody></tbody></table>
  <button id="adminLogout" style="margin-top:16px;padding:8px 12px;background:#e8bd58;border:0;cursor:pointer;font-weight:700;">CERRAR SESION</button>
</div>
<div id="wrap"><canvas id="game" width="1440" height="810"></canvas></div>
<a id="back" href="../">&larr; VOLVER</a>
<div id="status">cargando...</div>
<script src="pyodide/pyodide.js"></script>
<script src="game.js?v=99"></script>
</body>
</html>
